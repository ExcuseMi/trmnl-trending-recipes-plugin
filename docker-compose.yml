services:
  trmnl-trending-recipes:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trmnl-trending-recipes
    env_file:
      - .env
    ports:
      - "5080:5000"
    volumes:
      - recipe-data:/data
    environment:
      # IP Whitelist Configuration
      - ENABLE_IP_WHITELIST=${ENABLE_IP_WHITELIST:-true}
      # Database Configuration
      - DATABASE_PATH=/data/recipes.db
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      # /health answers 503 when the recipe fetch is not running (no primary worker, or the worker went silent):
      # stop gunicorn (PID 1) so the restart policy starts a fresh process that takes the lock and fetches again.
      # Only on a 503: a refused connection while booting is not a reason to restart (2026-11-17 outage, 4 days).
      test:
        - CMD
        - python
        - -c
        - |
          import os, signal, urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://localhost:5000/health', timeout=8)
          except urllib.error.HTTPError as e:
              if e.code == 503:
                  os.kill(1, signal.SIGTERM)
              raise
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db-backup:
    build:
      context: ./backend
      dockerfile: backup.Dockerfile
    container_name: trmnl-db-backup
    volumes:
      - recipe-data:/data
      - ./backups:/backups
    environment:
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
    restart: unless-stopped

volumes:
  recipe-data:
    driver: local